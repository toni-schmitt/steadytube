name: Verify tap access

# Manual diagnostic for `update-tap`: checks out toni-schmitt/homebrew-tap with
# TAP_TOKEN, renders packaging/steadytube.rb.tmpl, and runs `git push --dry-run`
# without writing anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify CI can write to the tap
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check TAP_TOKEN is configured
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_TOKEN is not set on this repository." >&2
            echo "Create a fine-grained PAT with Contents: read and write on" >&2
            echo "toni-schmitt/homebrew-tap, then: gh secret set TAP_TOKEN" >&2
            exit 1
          fi
          echo "TAP_TOKEN is present (${#TAP_TOKEN} characters)."

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: toni-schmitt/homebrew-tap
          token: ${{ secrets.TAP_TOKEN }}
          path: tap
          persist-credentials: true
          fetch-depth: 0

      - name: Render formula template
        run: |
          set -euo pipefail
          fake=$(printf '0%.0s' $(seq 1 64))
          sed \
            -e "s|@@VERSION@@|0.0.0|g" \
            -e "s|@@SHA_MACOS_ARM64@@|${fake}|g" \
            -e "s|@@SHA_MACOS_X64@@|${fake}|g" \
            -e "s|@@SHA_LINUX_X64@@|${fake}|g" \
            -e "s|@@SHA_LINUX_ARM64@@|${fake}|g" \
            packaging/steadytube.rb.tmpl > /tmp/steadytube.rb
          if grep -qE '@@[A-Z0-9_]+@@' /tmp/steadytube.rb; then
            echo "template left unreplaced placeholders" >&2
            exit 1
          fi
          ruby -c /tmp/steadytube.rb
          echo "Template renders to syntactically valid Ruby."

      - name: Prove the token can push (dry-run)
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q --allow-empty -m "tap access check (never pushed)"
          git push --dry-run origin HEAD:main
          echo "TAP_TOKEN can write to toni-schmitt/homebrew-tap."

      - name: Confirm tap is unchanged
        working-directory: tap
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin main | cut -f1)
          local_sha=$(git rev-parse HEAD)
          if [ "$remote_sha" = "$local_sha" ]; then
            echo "the dry-run push actually landed — it should not have" >&2
            exit 1
          fi
          echo "Confirmed: the tap is unchanged."
