name: CI

# Typecheck, run tests, and verify standalone binary compilation + smoke test
# on every push and pull request.
#
# Third-party actions are pinned to commit SHAs; the version is in the comment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Build standalone binary
        run: |
          mkdir -p dist
          bun build --compile src/index.ts --outfile dist/steadytube

      - name: Smoke test binary
        run: ./scripts/smoke-test.sh dist

      - name: Verify macOS x64 cross-compile
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-x64
          bun build --compile --target=bun-darwin-x64 src/index.ts --outfile dist-x64/steadytube
          file dist-x64/steadytube
          file dist-x64/steadytube | grep -q 'x86_64' || { echo "missing x86_64 binary" >&2; exit 1; }
